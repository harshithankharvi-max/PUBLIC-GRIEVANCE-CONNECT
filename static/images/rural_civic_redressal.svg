<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Canvas / Scene Frame -->
  <rect width="680" height="480" rx="20" fill="url(#skyGrad)"/>

  <!-- Subtle Geospatial GIS Grid Lines -->
  <g opacity="0.12" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="80" x2="640" y2="80"/>
    <line x1="40" y1="160" x2="640" y2="160"/>
    <line x1="40" y1="240" x2="640" y2="240"/>
    <line x1="40" y1="320" x2="640" y2="320"/>
    <line x1="120" y1="40" x2="120" y2="400"/>
    <line x1="240" y1="40" x2="240" y2="400"/>
    <line x1="360" y1="40" x2="360" y2="400"/>
    <line x1="480" y1="40" x2="480" y2="400"/>
    <line x1="600" y1="40" x2="600" y2="400"/>
  </g>

  <!-- Rolling Rural Hills -->
  <path d="M0,340 Q160,280 340,320 T680,290 L680,480 L0,480 Z" fill="#064e3b" opacity="0.45"/>
  <path d="M0,370 Q180,310 400,350 T680,330 L680,480 L0,480 Z" fill="#047857" opacity="0.55"/>
  <path d="M0,400 Q200,360 440,390 T680,370 L680,480 L0,480 Z" fill="url(#groundGrad)"/>

  <!-- Rural Road (PWD Domain) -->
  <path d="M220,480 L320,380 L350,380 L440,480 Z" fill="#334155"/>
  <path d="M333,385 L328,480" stroke="#facc15" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Gram Panchayat Administrative Building -->
  <g transform="translate(70, 240)">
    <!-- Base & Walls -->
    <rect x="0" y="50" width="160" height="90" rx="4" fill="#f8fafc" opacity="0.95"/>
    <!-- Triangular Pediment -->
    <polygon points="80,10 -5,50 165,50" fill="#e2e8f0"/>
    <!-- Civic Pillars -->
    <rect x="18" y="55" width="12" height="85" rx="2" fill="#cbd5e1"/>
    <rect x="52" y="55" width="12" height="85" rx="2" fill="#cbd5e1"/>
    <rect x="96" y="55" width="12" height="85" rx="2" fill="#cbd5e1"/>
    <rect x="130" y="55" width="12" height="85" rx="2" fill="#cbd5e1"/>
    <!-- Emblem Plaque -->
    <circle cx="80" cy="35" r="9" fill="#1e3a8a"/>
    <text x="80" y="38" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">🏛️</text>
    <!-- Building Text -->
    <text x="80" y="100" font-size="9" fill="#1e3a8a" text-anchor="middle" font-family="sans-serif" font-weight="bold">GRAM PANCHAYAT</text>
    <text x="80" y="112" font-size="7.5" fill="#64748b" text-anchor="middle" font-family="sans-serif">Rural Redressal Cell</text>
  </g>

  <!-- Electricity Department Infrastructure (Pole + Solar Streetlight) -->
  <g transform="translate(250, 180)">
    <!-- Utility Pole -->
    <line x1="20" y1="20" x2="20" y2="200" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Power Lines -->
    <path d="M20,40 Q-80,60 -180,45" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
    <path d="M20,40 Q100,50 200,30" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
    <!-- Solar Streetlight Fixture -->
    <line x1="20" y1="20" x2="55" y2="5" stroke="#94a3b8" stroke-width="3"/>
    <ellipse cx="55" cy="5" rx="14" ry="4" fill="#38bdf8" transform="rotate(-15 55 5)"/>
    <circle cx="50" cy="10" r="4" fill="#fef08a"/>
    <!-- Light Glow Beam -->
    <polygon points="50,12 10,130 90,130" fill="#fef08a" opacity="0.12"/>
    <!-- Spark Badge -->
    <circle cx="20" cy="30" r="10" fill="#f59e0b"/>
    <text x="20" y="34" font-size="11" fill="#fff" text-anchor="middle">⚡</text>
  </g>

  <!-- Water & Sanitation Infrastructure (Overhead Tank & Clean Supply) -->
  <g transform="translate(470, 230)">
    <!-- Staging Legs -->
    <line x1="25" y1="60" x2="10" y2="150" stroke="#64748b" stroke-width="4"/>
    <line x1="75" y1="60" x2="90" y2="150" stroke="#64748b" stroke-width="4"/>
    <line x1="15" y1="100" x2="85" y2="100" stroke="#64748b" stroke-width="2.5"/>
    <!-- Water Tank Reservoir -->
    <rect x="15" y="10" width="70" height="50" rx="8" fill="#0284c7"/>
    <path d="M15,35 Q50,45 85,35 L85,52 Q50,60 15,52 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Water Drop Icon -->
    <circle cx="50" cy="28" r="9" fill="#ffffff" opacity="0.9"/>
    <text x="50" y="32" font-size="11" fill="#0284c7" text-anchor="middle">💧</text>
    <text x="50" y="80" font-size="8" fill="#e0f2fe" text-anchor="middle" font-family="sans-serif" font-weight="bold">JAL JEEVAN</text>
  </g>

  <!-- Citizen Reporting with Smartphone (Foreground Right) -->
  <g transform="translate(370, 160)" filter="url(#shadowFilter)">
    <!-- Glassmorphic App Overlay Card -->
    <rect x="0" y="0" width="260" height="180" rx="14" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
    
    <!-- Header of App Simulation -->
    <rect x="0" y="0" width="260" height="38" rx="14" fill="rgba(15, 23, 42, 0.65)"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="34" y="23" font-size="11" fill="#ffffff" font-family="sans-serif" font-weight="bold">GrievanceConnect Mobile</text>
    <rect x="195" y="10" width="50" height="18" rx="9" fill="#2563eb"/>
    <text x="220" y="23" font-size="9" fill="#ffffff" font-family="sans-serif" font-weight="bold" text-anchor="middle">LIVE GIS</text>

    <!-- Simulated AI & Category Analysis Rows -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="232" height="34" rx="8" fill="rgba(255, 255, 255, 0.12)"/>
      <text x="12" y="16" font-size="9" fill="#93c5fd" font-family="sans-serif">Report Mode:</text>
      <text x="12" y="28" font-size="10" fill="#ffffff" font-family="sans-serif" font-weight="bold">🎙️ Voice Input (English + ಕನ್ನಡ)</text>
      <circle cx="214" cy="17" r="7" fill="#10b981"/>
      <text x="214" y="20.5" font-size="8" fill="#fff" text-anchor="middle">✓</text>
    </g>

    <g transform="translate(14, 94)">
      <rect x="0" y="0" width="232" height="34" rx="8" fill="rgba(255, 255, 255, 0.12)"/>
      <text x="12" y="16" font-size="9" fill="#93c5fd" font-family="sans-serif">AI Classification & Priority:</text>
      <text x="12" y="28" font-size="10" fill="#facc15" font-family="sans-serif" font-weight="bold">🤖 Automated Hazard Routing</text>
      <rect x="175" y="8" width="46" height="18" rx="4" fill="#dc2626"/>
      <text x="198" y="21" font-size="9" fill="#ffffff" font-family="sans-serif" font-weight="bold" text-anchor="middle">HIGH</text>
    </g>

    <!-- Target Department Dispatch -->
    <g transform="translate(14, 136)">
      <rect x="0" y="0" width="232" height="32" rx="8" fill="rgba(30, 58, 138, 0.6)"/>
      <text x="12" y="20" font-size="9.5" fill="#e0f2fe" font-family="sans-serif">⚡ Electricity &nbsp;|&nbsp; 🏗️ PWD &nbsp;|&nbsp; 💧 Water</text>
    </g>
  </g>

  <!-- Geospatial Location Pin Marker Pulse -->
  <g transform="translate(290, 290)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
    <circle cx="30" cy="30" r="18" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.7"/>
    <!-- Red Location Pin -->
    <path d="M30,10 C21.7,10 15,16.7 15,25 C15,35 30,50 30,50 C30,50 45,35 45,25 C45,16.7 38.3,10 30,10 Z" fill="url(#glowPin)"/>
    <circle cx="30" cy="24" r="5" fill="#ffffff"/>
    <!-- Geotag Badge -->
    <rect x="-35" y="54" width="130" height="22" rx="11" fill="rgba(15, 23, 42, 0.9)" stroke="#ef4444" stroke-width="1"/>
    <text x="30" y="68" font-size="9" fill="#ffffff" font-family="sans-serif" font-weight="bold" text-anchor="middle">📍 GPS: 14.42° N, 74.42° E</text>
  </g>

  <!-- Top Emblem / Tech Badge -->
  <g transform="translate(25, 24)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
    <circle cx="16" cy="16" r="8" fill="#10b981"/>
    <text x="16" y="20" font-size="10" fill="#fff" text-anchor="middle">✓</text>
    <text x="32" y="20" font-size="10.5" fill="#ffffff" font-family="sans-serif" font-weight="bold">AI-Enabled Rural Grievance Redressal</text>
  </g>
</svg>

